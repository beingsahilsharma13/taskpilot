<!DOCTYPE html>
<html>
<head>
  <title>TaskPilot Dashboard</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary:#667eea; --success:#4CAF50; --warning:#f59e0b; --danger:#f87171; --bg:#0f0f14; --surface:#16161e; --border:rgba(255,255,255,0.07); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e2e8f0; }
    .dashboard { padding: 20px; max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 30px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 8px; }
    .stat-card h3 { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .stat-card .value { font-size: 32px; font-weight: 700; color: #fff; }
    .stat-card .unit { font-size: 12px; color: #64748b; margin-left: 5px; }

    .section { margin-bottom: 40px; }
    .section h2 { font-size: 20px; margin-bottom: 20px; color: #fff; }

    .execution-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .execution-table th { background: rgba(102, 126, 234, 0.1); padding: 12px; text-align: left; font-size: 12px; font-weight: 600; color: #94a3b8; letter-spacing: 0.5px; }
    .execution-table td { padding: 12px; border-top: 1px solid var(--border); font-size: 14px; }
    .execution-table tr:hover { background: rgba(102, 126, 234, 0.05); }

    .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge.success { background: rgba(76, 175, 80, 0.15); color: var(--success); }
    .badge.failed { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
    .badge.running { background: rgba(102, 126, 234, 0.15); color: var(--primary); }

    .time-cell { font-family: 'Courier New', monospace; font-size: 12px; color: #64748b; }
    .response-preview { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #94a3b8; }

    .empty { text-align: center; padding: 40px; color: #64748b; }
    .empty-icon { font-size: 48px; margin-bottom: 10px; opacity: 0.3; }
  </style>
</head>
<body>

<div class="dashboard">
  <h1>📊 TaskPilot Dashboard</h1>

  <!-- Stats -->
  <div class="stats-grid" id="stats-grid">
    <div class="stat-card">
      <h3>Total Tasks</h3>
      <div><span class="value" id="stat-total">0</span></div>
    </div>
    <div class="stat-card">
      <h3>Running Tasks</h3>
      <div><span class="value" id="stat-running" style="color:#667eea">0</span></div>
    </div>
    <div class="stat-card">
      <h3>Completed Tasks</h3>
      <div><span class="value" id="stat-completed" style="color:#4CAF50">0</span></div>
    </div>
    <div class="stat-card">
      <h3>Failed Tasks</h3>
      <div><span class="value" id="stat-failed" style="color:#f87171">0</span></div>
    </div>
    <div class="stat-card">
      <h3>Total Executions</h3>
      <div><span class="value" id="stat-executions">0</span></div>
    </div>
    <div class="stat-card">
      <h3>Success Rate</h3>
      <div><span class="value" id="stat-success-rate">0</span><span class="unit">%</span></div>
    </div>
  </div>

  <!-- Recent Executions -->
  <div class="section">
    <h2>📝 Recent Executions</h2>
    <table class="execution-table" id="executions-table">
      <thead>
        <tr>
          <th>Task</th>
          <th>Provider</th>
          <th>Status</th>
          <th>Duration</th>
          <th>Response</th>
          <th>Executed</th>
        </tr>
      </thead>
      <tbody id="executions-body">
        <tr><td colspan="6" style="text-align:center;padding:40px;color:#64748b">Loading executions...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- System Logs -->
  <div class="section">
    <h2>⚙️ System Logs</h2>
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; max-height: 400px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px;">
      <div id="system-logs">
        <div style="color:#64748b">No logs yet...</div>
      </div>
    </div>
  </div>
</div>

<script>
  const api = window.taskpilot;

  async function loadDashboard() {
    try {
      // Get stats
      const stats = await api.getStats?.() || {};
      document.getElementById('stat-total').textContent = stats.totalTasks || 0;
      document.getElementById('stat-running').textContent = stats.runningTasks || 0;
      document.getElementById('stat-completed').textContent = stats.completedTasks || 0;
      document.getElementById('stat-failed').textContent = stats.failedTasks || 0;
      document.getElementById('stat-executions').textContent = stats.totalExecutions || 0;
      
      const rate = stats.totalExecutions && stats.successfulExecutions 
        ? Math.round((stats.successfulExecutions / stats.totalExecutions) * 100)
        : 0;
      document.getElementById('stat-success-rate').textContent = rate;

      // Get executions
      const executions = await api.getExecutions?.() || [];
      const tbody = document.getElementById('executions-body');
      tbody.innerHTML = executions.length === 0
        ? '<tr><td colspan="6" style="text-align:center;padding:40px;color:#64748b">No executions yet</td></tr>'
        : executions.slice(0, 20).map(e => `
            <tr>
              <td>${e.task_id ? e.task_id.substring(0, 8) : '—'}</td>
              <td style="font-family:monospace;font-size:12px">${e.ai_provider || '—'}</td>
              <td><span class="badge ${e.status === 'completed' ? 'success' : 'failed'}">${e.status}</span></td>
              <td class="time-cell">${e.duration_ms ? e.duration_ms + 'ms' : '—'}</td>
              <td class="response-preview">${e.ai_response ? e.ai_response.substring(0, 60) : e.error || '—'}</td>
              <td class="time-cell">${e.executed_at ? new Date(e.executed_at).toLocaleString() : '—'}</td>
            </tr>`).join('');

      // Get logs
      const logs = await api.getSystemLogs?.() || [];
      const logsDiv = document.getElementById('system-logs');
      logsDiv.innerHTML = logs.length === 0
        ? '<div style="color:#64748b">No logs yet...</div>'
        : logs.slice(0, 50).map(l => `
            <div style="color:${l.level === 'error' ? '#f87171' : l.level === 'warn' ? '#f59e0b' : '#94a3b8'}">
              [${l.level.toUpperCase()}] ${l.service} — ${l.message}</div>`).join('');

    } catch (err) {
      console.error('Dashboard error:', err);
    }
  }

  // Reload every 5 seconds
  loadDashboard();
  setInterval(loadDashboard, 5000);
</script>
</body>
</html>
