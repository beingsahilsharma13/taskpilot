<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskPilot</title>
<style>
:root{
  --bg:#0f0f14;--surface:#16161e;--card:#1c1c26;--border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.16);--text:#e7e7ea;--muted:#8a8a99;--muted2:#b4b4c0;
  --green:#6ee7b7;--indigo:#818cf8;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden}

#bar{height:46px;-webkit-app-region:drag;display:flex;align-items:center;padding:0 16px 0 78px;border-bottom:1px solid var(--border);background:var(--surface);gap:10px;flex-shrink:0}
.logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--indigo),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:13px}
.title{font-weight:600}
.sub{color:var(--muted);font-size:12px}
.gear{-webkit-app-region:no-drag;margin-left:auto;background:none;border:1px solid var(--border2);color:var(--muted2);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer}
.gear:hover{color:var(--text)}

#main{flex:1;overflow-y:auto;padding:18px}
#main::-webkit-scrollbar{width:4px}#main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.wrap{max-width:660px;margin:0 auto}

.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:block}
textarea#tasks{width:100%;min-height:160px;background:var(--card);border:1px solid var(--border2);color:var(--text);border-radius:10px;padding:14px;font-size:14px;line-height:1.7;resize:vertical;outline:none;font-family:inherit}
textarea#tasks:focus{border-color:var(--indigo)}
textarea#tasks::placeholder{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}

.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-run{background:var(--green);color:#0f0f14}
.btn-login{background:var(--card);color:var(--blue);border:1px solid var(--border2)}
.btn-stop{background:var(--red);color:#fff;flex:0 0 auto;padding:12px 20px}
.btn:hover:not(:disabled){opacity:.88}

/* Config */
#config{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;display:none}
#config.open{display:block}
.cfg-group{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.cfg-group:first-of-type{border-top:none;padding-top:0;margin-top:0}
.cfg-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.cfg-head .gname{font-weight:600;font-size:13px}
.switch{position:relative;width:38px;height:21px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border2);border-radius:21px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--green)}
.switch input:checked + .slider:before{transform:translateX(17px)}
.field{margin-bottom:10px}
.field label{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;letter-spacing:.05em;display:block;margin-bottom:4px}
.field input{width:100%;background:var(--card);border:1px solid var(--border2);color:var(--text);padding:9px 11px;border-radius:7px;font-size:13px;outline:none;font-family:inherit}
.field input:focus{border-color:var(--indigo)}
.two{display:flex;gap:10px}.two .field{flex:1}
.save-cfg{width:100%;margin-top:6px;padding:10px;background:var(--indigo);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}

/* Log */
#log-wrap{margin-top:20px}
#log{background:#0b0b0f;border:1px solid var(--border);border-radius:10px;padding:12px;height:230px;overflow-y:auto;font-family:ui-monospace,monospace;font-size:12px;line-height:1.7}
#log::-webkit-scrollbar{width:4px}#log::-webkit-scrollbar-thumb{background:var(--border2)}
.line{margin-bottom:3px;white-space:pre-wrap;word-break:break-word}
.line.info{color:var(--muted2)}
.line.login{color:var(--amber)}
.line.task-start{color:var(--blue);font-weight:600;margin-top:6px}
.line.task-done{color:var(--green)}
.line.task-answer{color:var(--muted)}
.line.task-error,.line.error{color:var(--red)}
.line.done{color:var(--green);font-weight:600;margin-top:6px}
.line.closed{color:var(--muted);font-style:italic;margin-top:4px}
.empty-log{color:var(--muted);font-style:italic}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border2);padding:9px 16px;border-radius:9px;font-size:13px;z-index:50}
.toast.ok{border-color:rgba(110,231,183,.4);color:var(--green)}
</style>
</head>
<body>
<div id="bar">
  <div class="logo">🚀</div>
  <div><span class="title">TaskPilot</span> &nbsp;<span class="sub">prompts → Claude → email / whatsapp</span></div>
  <button class="gear" onclick="toggleConfig()">⚙ Configure</button>
</div>

<div id="main">
  <div class="wrap">

    <!-- CONFIG -->
    <div id="config">
      <!-- Email -->
      <div class="cfg-group">
        <div class="cfg-head">
          <label class="switch"><input type="checkbox" id="emailEnabled"/><span class="slider"></span></label>
          <span class="gname">📧 Email (Gmail)</span>
        </div>
        <div class="two">
          <div class="field"><label>GMAIL ADDRESS</label><input id="gmailUser" placeholder="you@gmail.com"/></div>
          <div class="field"><label>GMAIL APP PASSWORD</label><input id="gmailPass" type="password" placeholder="xxxx xxxx xxxx xxxx"/></div>
        </div>
        <div class="field"><label>SEND ANSWERS TO</label><input id="emailTo" placeholder="where to receive answers@gmail.com"/></div>
      </div>
      <!-- WhatsApp -->
      <div class="cfg-group">
        <div class="cfg-head">
          <label class="switch"><input type="checkbox" id="whatsappEnabled"/><span class="slider"></span></label>
          <span class="gname">📱 WhatsApp (Twilio)</span>
        </div>
        <div class="two">
          <div class="field"><label>TWILIO ACCOUNT SID</label><input id="twilioSid" placeholder="ACxxxxxxxx"/></div>
          <div class="field"><label>TWILIO AUTH TOKEN</label><input id="twilioToken" type="password" placeholder="token"/></div>
        </div>
        <div class="two">
          <div class="field"><label>FROM (TWILIO WHATSAPP)</label><input id="twilioFrom" placeholder="+14155238886"/></div>
          <div class="field"><label>YOUR WHATSAPP NUMBER</label><input id="whatsappTo" placeholder="+91XXXXXXXXXX"/></div>
        </div>
      </div>
      <button class="save-cfg" onclick="saveConfig()">💾 Save configuration</button>
    </div>

    <!-- TASKS -->
    <label class="label">Your tasks for today</label>
    <textarea id="tasks" placeholder="Write one task per line, for example:

Summarize the top 5 Java news from this week
Write a short standup update about finishing the login API
Give me 3 interview questions on Java concurrency with answers"></textarea>
    <div class="hint">One task per line. For a long multi-line prompt, separate tasks with a line containing only <code>---</code>.</div>

    <div class="row">
      <button class="btn btn-login" id="btnLogin" onclick="doLogin()">🔑 Open Claude &amp; log in (first time)</button>
      <button class="btn btn-run" id="btnRun" onclick="doRun()">▶ Run tasks</button>
      <button class="btn btn-stop" id="btnStop" onclick="doStop()" style="display:none">⏹ Stop</button>
    </div>

    <!-- LOG -->
    <div id="log-wrap">
      <label class="label">Live progress</label>
      <div id="log"><div class="empty-log">Logs will appear here when you run…</div></div>
    </div>

  </div>
</div>

<script>
const FIELDS = ['emailEnabled','gmailUser','gmailPass','emailTo','whatsappEnabled','twilioSid','twilioToken','twilioFrom','whatsappTo'];
let running = false;

async function init() {
  const cfg = await window.app.getConfig();
  FIELDS.forEach(f => {
    const el = document.getElementById(f);
    if (!el) return;
    if (el.type === 'checkbox') el.checked = !!cfg[f];
    else el.value = cfg[f] || '';
  });
  window.app.onLog(addLog);
  window.app.onFinished(() => setRunning(false));
}

function toggleConfig(){ document.getElementById('config').classList.toggle('open'); }

async function saveConfig() {
  const cfg = {};
  FIELDS.forEach(f => {
    const el = document.getElementById(f);
    cfg[f] = el.type === 'checkbox' ? el.checked : el.value.trim();
  });
  await window.app.saveConfig(cfg);
  toast('Configuration saved ✓');
}

function parseTasks(text) {
  if (/^\s*---\s*$/m.test(text)) {
    return text.split(/^\s*---\s*$/m).map(s => s.trim()).filter(Boolean);
  }
  return text.split('\n').map(s => s.trim()).filter(Boolean);
}

function clearLog(){ document.getElementById('log').innerHTML = ''; }
function addLog(d) {
  const log = document.getElementById('log');
  const empty = log.querySelector('.empty-log');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'line ' + (d.type || 'info');
  div.textContent = d.msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function setRunning(on) {
  running = on;
  document.getElementById('btnRun').style.display = on ? 'none' : '';
  document.getElementById('btnLogin').style.display = on ? 'none' : '';
  document.getElementById('btnStop').style.display = on ? '' : 'none';
}

async function doLogin() {
  clearLog();
  setRunning(true);
  await window.app.login();
}

async function doRun() {
  const tasks = parseTasks(document.getElementById('tasks').value);
  if (!tasks.length) { toast('Add at least one task first'); return; }
  const cfg = await window.app.getConfig();
  if (!cfg.emailEnabled && !cfg.whatsappEnabled) {
    toast('Turn on Email or WhatsApp in ⚙ Configure first');
    document.getElementById('config').classList.add('open');
    return;
  }
  clearLog();
  setRunning(true);
  addLog({ type:'info', msg:`Starting ${tasks.length} task(s)…` });
  await window.app.run(tasks);
}

async function doStop() {
  await window.app.stop();
  setRunning(false);
  addLog({ type:'closed', msg:'Stopped by you.' });
}

let toastTimer;
function toast(msg) {
  let t = document.querySelector('.toast');
  if (t) t.remove();
  t = document.createElement('div');
  t.className = 'toast ok';
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

init();
</script>
</body>
</html>
